  </defs>
  <g font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, sans-serif" font-size="15" font-weight="600" text-anchor="middle" fill="#1f2328">
    <rect x="10" y="30" width="120" height="44" rx="22" fill="#ffffff" stroke="#8c959f" stroke-width="1.5"/>
