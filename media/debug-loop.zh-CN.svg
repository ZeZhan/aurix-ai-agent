  <text x="450" y="144" font-family="Microsoft YaHei, PingFang SC, Noto Sans CJK SC, Segoe UI, sans-serif" font-size="13" font-weight="600" text-anchor="middle" fill="#0b8a8f">检查未通过：修复后再来一轮</text>
