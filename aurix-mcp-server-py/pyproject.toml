[project]
name = "aurix-mcp-server"
version = "0.2.0"
description = "AURIX microcontroller build/flash/project/examples tools exposed over MCP (Python)."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "mcp==1.28.1",
]

[project.urls]
Homepage = "https://github.com/ZeZhan/aurix-ai-agent"
Repository = "https://github.com/ZeZhan/aurix-ai-agent.git"
Issues = "https://github.com/ZeZhan/aurix-ai-agent/issues"

[project.scripts]
aurix-mcp-server = "aurix_mcp_server.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aurix_mcp_server"]

[tool.hatch.build.targets.wheel.force-include]
"examples.index.json" = "aurix_mcp_server/examples.index.json"
"examples.manifest.json.gz" = "aurix_mcp_server/examples.manifest.json.gz"
"THIRD_PARTY_NOTICES.txt" = "aurix_mcp_server/THIRD_PARTY_NOTICES.txt"
